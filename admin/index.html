<!DOCTYPE html>
<html lang="pl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FieldCheck — panel administratora</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script>document.documentElement.dataset.theme = localStorage.getItem('fc.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
</head>
<body>
  <!-- Logowanie -->
  <div id="login" class="login-wrap hidden">
    <form class="card login-card" id="loginForm">
      <div class="login-head">
        <div class="logo">Field<b>Check</b></div>
        <div class="login-controls"></div>
      </div>
      <h2 data-i18n="login_admin_title"></h2>
      <div class="field"><label data-i18n="email"></label><input name="email" type="email" required autocomplete="username"></div>
      <div class="field"><label data-i18n="password"></label><input name="password" type="password" required autocomplete="current-password"></div>
      <p class="bad small hidden" id="loginErr"></p>
      <p class="warn small hidden" id="expiredMsg" data-i18n="session_expired"></p>
      <div class="field hidden" id="mfaStep"><label data-i18n="mfa_code"></label><input name="code" data-i18n-tip="h_mfa_code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"></div>
      <button class="btn btn-primary btn-block" data-i18n="login"></button>
      <p class="small"><a href="#" id="forgotLink" class="hidden" data-i18n="forgot_password" data-i18n-tip="h_forgot"></a></p>
      <p class="muted small" id="demoCreds"></p>
      <p class="muted small"><span data-i18n="prototype_note"></span> · <span class="version-text"></span></p>
    </form>
  </div>

  <!-- Ustawienie hasła (link z zaproszenia / resetu) -->
  <div id="pwSet" class="login-wrap hidden">
    <form class="card login-card" id="pwForm">
      <div class="login-head"><div class="logo">Field<b>Check</b></div></div>
      <h2 data-i18n="set_password_title"></h2>
      <p class="muted small" data-i18n="set_password_info"></p>
      <div class="field"><label data-i18n="new_password"></label><input name="pw" type="password" data-i18n-tip="h_pw_rules" minlength="8" required autocomplete="new-password"></div>
      <div class="field"><label data-i18n="repeat_password"></label><input name="pw2" type="password" minlength="8" required autocomplete="new-password"></div>
      <p class="bad small hidden" id="pwErr"></p>
      <button class="btn btn-primary btn-block" data-i18n="save"></button>
    </form>
  </div>

  <!-- Panel -->
  <div id="shell" class="shell hidden">
    <aside class="side">
      <a class="logo" href="../">Field<b>Check</b></a>
      <nav id="nav"></nav>
      <div class="side-foot">
        <div class="side-controls"></div>
        <div class="version version-text"></div>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <h1 class="page-h"><i id="pageIc" class="page-ic"></i><span id="pageTitle"></span></h1>
        <div class="top-right">
          <div class="bell-wrap">
            <button class="btn btn-ghost bell" id="bell" data-i18n-tip="h_bell">🔔<span class="bell-count hidden" id="bellCount"></span></button>
            <div class="bell-panel card hidden" id="bellPanel"></div>
          </div>
          <button type="button" id="who" class="btn btn-ghost who" data-i18n-tip="h_my_account"></button>
          <button class="btn btn-ghost" id="logoutBtn" data-i18n="logout" data-i18n-tip="h_logout"></button>
        </div>
      </header>
      <section id="view"></section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
